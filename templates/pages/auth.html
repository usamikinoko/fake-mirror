{{define "content"}}
<div class="container">
    <div class="auth-hero">
        <h2 class="auth-title">Private Access</h2>
        <p class="auth-desc">此区域仅对受邀访客开放，请输入访问口令</p>
        <form class="auth-form" id="deep-auth-form">
            <input
                class="auth-input"
                id="deep-auth-input"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="访问口令"
                maxlength="32"
            />
            <button class="auth-submit" type="submit">验证</button>
        </form>
        <p class="auth-error" id="deep-auth-error" hidden>口令错误</p>
        <div class="auth-divider"></div>
    </div>
</div>
{{end}}
